# fly.toml app configuration file generated for agenda-whatsapp on 2026-11-26T21:04:04-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'agenda-whatsapp'
primary_region = 'gru'

[build]
  image = 'didilangdon/evolution-api:latest'

[[mounts]]
  source = 'app_data'
  destination = '/app/app/server/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

