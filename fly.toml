# fly.toml app configuration file generated for saveweb2zip-com-app-gestek-com-br-1 on 2026-11-26T00:29:21-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'saveweb2zip-com-app-gestek-com-br-1'
primary_region = 'gru'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
   [mounts]
     source = "app_data"
     destination = "/app/app/server/data"